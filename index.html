<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>NID's Transit Map Editor</title><link rel="stylesheet" href="style.css"></head><body><header><strong>🚎 NID's Map Editor</strong><span id="status">Saved locally</span></header><main><aside><label>Draw mode<select id="mode"><option value="pan">🖐 Pan / inspect</option><option value="street">🛣 Street</option><option value="rail">🚋 Tram rail</option><option value="route">🚌 Bus / tram route</option><option value="train">🚆 Train service route</option><option value="cemetery">🪦 Cemetery route</option><option value="stop">🚏 Stop</option><option value="building">🏢 Building</option><option value="park">🌳 Park</option><option value="erase">🗑 Delete</option></select></label><label>Name / label<input id="name" placeholder="Main Street / Stop A"></label><label>Service status<select id="serviceStatus"><option value="active">🟢 Active service</option><option value="suspended">🔴 Suspended service</option><option value="planned">🟡 Planned service</option></select></label><label>Route color<input id="color" type="color" value="#f97316"></label><p class="hint">Tap the map to add points. For streets, rails, routes and buildings, tap <b>Finish shape</b> when done. Tap an existing object in Pan mode to inspect it.</p><div class="buttons"><button id="finish">Finish shape</button><button id="undo">Undo point</button><button id="cancel">Cancel drawing</button></div><div class="buttons"><button id="fit">Fit map</button><button id="export">Export JSON</button><label class="file">Import JSON<input type="file" id="import" accept=".json,application/json" hidden></label></div><div class="buttons"><button id="png">Export PNG</button><button id="clear" class="danger">Clear all</button></div><label>Layers</label><div id="layers"></div><section><h3>Map objects <span id="count"></span></h3><div id="objects"></div></section></aside><section class="map-area"><div class="map-toolbar"><button id="zoomIn" aria-label="Zoom in">＋</button><button id="zoomOut" aria-label="Zoom out">－</button><span id="coords">x: 0, y: 0</span></div><canvas id="map"></canvas><div class="map-help">Drag to move • Pinch / scroll to zoom • Tap to draw</div></section></main><script src="app.js"></script></body></html>
